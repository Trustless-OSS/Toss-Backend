services:
  - type: web
    name: toss-backend
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 5000
    autoDeploy: true

databases:
  - name: postgres
    engine: postgres
    version: "16"
    plan: starter

  - name: redis
    engine: redis
    version: "7"
    plan: starter
