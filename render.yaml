services:
  - type: web
    name: toss-backend
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
    autoDeploy: true
    databaseName: toss-postgres
    databaseUser: postgres

  - type: redis
    name: toss-redis
    plan: starter
    maxmemoryPolicy: noevict

databases:
  - name: toss-postgres
    engine: postgres
    version: "16"
    plan: starter
