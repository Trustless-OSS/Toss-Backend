[package]
name = "toss-backend"
description="This backend is made for Trustless-OSS  by using Rust axum to make Blazzing Fast server !!"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "9", features = ["use_pem"] }
redis = { version = "0.29", features = ["aio", "tokio-rustls-comp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_decimal = { version = "1.42", features = ["serde-with-str", "db-diesel2-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stellar-base = "0.7"
stellar-xdr = { version = "27.0.0", features = ["base64"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
diesel = { version = "2.2", features = ["postgres_backend", "uuid", "chrono"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2.2"
# diesel-async's pg backend uses `futures_util::try_join!`, which lives behind
# the `async-await-macro` feature; depend on it directly so the feature is on.
futures-util = { version = "0.3", features = ["async-await-macro"] }
