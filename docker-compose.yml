services:
  postgres:
    image: postgres:16-alpine
    container_name: toss_postgres
    environment:
      POSTGRES_DB: trustless_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema is now managed by Diesel migrations, which the app runs on startup
    # (see src/main.rs). Run them manually with `diesel migration run`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustless_oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: toss_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
