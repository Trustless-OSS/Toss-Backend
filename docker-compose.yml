services:
  postgres:
    image: postgres:16-alpine
    container_name: toss_postgres
    environment:
      POSTGRES_DB: trustless_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_toss.sql:/docker-entrypoint-initdb.d/0001_toss.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustless_oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: toss_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: toss_uptime_kuma
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uptime_kuma_data:
